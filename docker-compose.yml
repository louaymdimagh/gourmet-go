version: '3.8'

networks:
  gourmetgo-network:
    driver: bridge

services:

  # ─── DATABASES ───────────────────────────────────────────────────────────────

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - gourmetgo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kitchen-db:
    image: postgres:15-alpine
    container_name: kitchen-db
    environment:
      POSTGRES_DB: kitchendb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - kitchen-db-data:/var/lib/postgresql/data
    networks:
      - gourmetgo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  accounting-db:
    image: postgres:15-alpine
    container_name: accounting-db
    environment:
      POSTGRES_DB: accountingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - accounting-db-data:/var/lib/postgresql/data
    networks:
      - gourmetgo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MICROSERVICES ────────────────────────────────────────────────────────────

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: ${DOCKER_USERNAME}/gourmet-go-order-service:latest
    container_name: order-service
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      DB_HOST: order-db
      DB_NAME: orderdb
      DB_USER: postgres
      DB_PASS: postgres
      ZIPKIN_HOST: zipkin
    depends_on:
      order-db:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - gourmetgo-network
    restart: on-failure

  kitchen-service:
    build:
      context: .
      dockerfile: kitchen-service/Dockerfile
    image: ${DOCKER_USERNAME}/gourmet-go-kitchen-service:latest
    container_name: kitchen-service
    ports:
      - "8082:8082"
      - "9092:9092"
    environment:
      DB_HOST: kitchen-db
      DB_NAME: kitchendb
      DB_USER: postgres
      DB_PASS: postgres
      ZIPKIN_HOST: zipkin
    depends_on:
      kitchen-db:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - gourmetgo-network
    restart: on-failure

  accounting-service:
    build:
      context: .
      dockerfile: accounting-service/Dockerfile
    image: ${DOCKER_USERNAME}/gourmet-go-accounting-service:latest
    container_name: accounting-service
    ports:
      - "8083:8083"
      - "9093:9093"
    environment:
      DB_HOST: accounting-db
      DB_NAME: accountingdb
      DB_USER: postgres
      DB_PASS: postgres
      ZIPKIN_HOST: zipkin
    depends_on:
      accounting-db:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - gourmetgo-network
    restart: on-failure

  order-orchestrator:
    build:
      context: .
      dockerfile: order-orchestrator/Dockerfile
    image: ${DOCKER_USERNAME}/gourmet-go-order-orchestrator:latest
    container_name: order-orchestrator
    ports:
      - "8080:8080"
    environment:
      ORDER_SERVICE_HOST: order-service
      KITCHEN_SERVICE_HOST: kitchen-service
      ACCOUNTING_SERVICE_HOST: accounting-service
      ZIPKIN_HOST: zipkin
    depends_on:
      - order-service
      - kitchen-service
      - accounting-service
      - zipkin
    networks:
      - gourmetgo-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    image: ${DOCKER_USERNAME}/gourmet-go-frontend:latest
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - order-orchestrator
    networks:
      - gourmetgo-network

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - gourmetgo-network

volumes:
  order-db-data:
  kitchen-db-data:
  accounting-db-data:
