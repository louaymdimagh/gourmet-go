name: Gourmet-Go CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-order-service:
    name: Build Order Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Order Service
        working-directory: ./order-service
        run: mvn clean package -DskipTests

  build-kitchen-service:
    name: Build Kitchen Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Kitchen Service
        working-directory: ./kitchen-service
        run: mvn clean package -DskipTests

  build-accounting-service:
    name: Build Accounting Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Accounting Service
        working-directory: ./accounting-service
        run: mvn clean package -DskipTests

  build-orchestrator:
    name: Build Orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Orchestrator
        working-directory: ./order-orchestrator
        run: mvn clean package -DskipTests

  docker-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - build-order-service
      - build-kitchen-service
      - build-accounting-service
      - build-orchestrator
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push order-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./order-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-order-service:latest
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-order-service:${{ github.sha }}

      - name: Build & Push kitchen-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./kitchen-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-kitchen-service:latest
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-kitchen-service:${{ github.sha }}

      - name: Build & Push accounting-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./accounting-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-accounting-service:latest
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-accounting-service:${{ github.sha }}

      - name: Build & Push order-orchestrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./order-orchestrator/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-order-orchestrator:latest
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-order-orchestrator:${{ github.sha }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/gourmet-go-frontend:${{ github.sha }}

      - name: Pipeline Summary
        run: |
          echo "✅ All images pushed to Docker Hub"
